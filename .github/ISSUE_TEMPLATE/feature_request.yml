name: 💡 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个建议针对什么痛点？现在是怎么用的？
      placeholder: 例如：每次专注结束都要手动切回应用，容易忘记已经结束了。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: 例如：计时结束时发送本地通知并震动提醒。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
